<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>六角 2048</title>
<style>
  :root {
    --bg: #faf8ef;
    --text: #776e65;
    --board: #bbada0;
    --cell: rgba(238, 228, 218, 0.35);
    --btn: #8f7a66;
    --size: min(460px, calc(100vw - 32px));
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    min-height: 100vh;
    touch-action: none;
  }
  .wrap { width: var(--size); }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  h1 { font-size: 52px; margin: 0; font-weight: 800; line-height: 1; }
  h1 small { display: block; font-size: 16px; font-weight: 700; letter-spacing: 2px; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--board);
    color: #fff;
    border-radius: 6px;
    padding: 6px 16px;
    text-align: center;
    min-width: 72px;
    position: relative;
  }
  .score-box .label { font-size: 12px; color: #eee4da; font-weight: 700; }
  .score-box .val { font-size: 22px; font-weight: 800; }
  .plus {
    position: absolute; left: 0; right: 0; top: 20px;
    font-weight: 800; color: rgba(119,110,101,.9);
    animation: floatUp .7s ease-out forwards;
    pointer-events: none;
  }
  @keyframes floatUp { to { transform: translateY(-40px); opacity: 0; } }
  .bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; gap: 8px; flex-wrap: wrap;
  }
  .bar .group { display: flex; gap: 8px; }
  button {
    background: var(--btn); color: #f9f6f2; border: 0; border-radius: 6px;
    padding: 10px 14px; font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  button:hover { filter: brightness(1.08); }
  button.size { background: #d6cdc4; color: var(--text); }
  button.size.active { background: var(--btn); color: #f9f6f2; }

  .board {
    position: relative;
    width: var(--size);
    margin: 0 auto;
  }
  .board-bg {
    position: absolute; inset: 0;
    background: var(--board);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  }
  .grid, .tiles { position: absolute; inset: 0; }
  .hex { clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
  .cell { position: absolute; left: 0; top: 0; background: var(--cell); }
  .tile {
    position: absolute; left: 0; top: 0;
    transition: transform 110ms ease-in-out;
    z-index: 1;
  }
  .tiles.noanim .tile { transition: none; }
  .tile .inner {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
  }
  .tile.new .inner { animation: appear 180ms ease 100ms backwards; }
  .tile.merged { z-index: 2; }
  .tile.merged .inner { animation: pop 200ms ease 100ms backwards; }
  @keyframes appear { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes pop { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

  .overlay {
    position: absolute; inset: 0; border-radius: 12px;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; z-index: 10;
    animation: fade .6s ease;
  }
  .overlay.show { display: flex; }
  .overlay.lose { background: rgba(238, 228, 218, 0.75); }
  .overlay.win { background: rgba(237, 194, 46, 0.55); color: #f9f6f2; }
  .overlay h2 { font-size: 48px; margin: 0; }
  .overlay .btns { display: flex; gap: 8px; }
  @keyframes fade { from { opacity: 0; } }

  .keys {
    display: grid; grid-template-columns: repeat(3, 44px); gap: 6px;
    justify-content: center; margin-top: 16px;
  }
  .keys button { padding: 8px 0; font-size: 18px; line-height: 1; }
  .keys button span { display: block; font-size: 10px; opacity: .7; margin-top: 2px; }
  .help { margin-top: 16px; font-size: 14px; line-height: 1.6; }

  @media (max-width: 420px) {
    h1 { font-size: 40px; }
    .score-box { min-width: 60px; padding: 4px 10px; }
    button { padding: 8px 10px; font-size: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2048<small>六角版</small></h1>
    <div class="scores">
      <div class="score-box" id="scoreBox"><div class="label">分數</div><div class="val" id="score">0</div></div>
      <div class="score-box"><div class="label">最高分</div><div class="val" id="best">0</div></div>
    </div>
  </header>
  <div class="bar">
    <div class="group">
      <button class="size" data-r="2" title="每邊 3 格，共 19 格">小</button>
      <button class="size" data-r="3" title="每邊 4 格，共 37 格">大</button>
    </div>
    <div class="group">
      <button id="undoBtn" title="復原上一步 (Z)">復原</button>
      <button id="newBtn">新遊戲</button>
    </div>
  </div>

  <div class="board" id="board">
    <div class="board-bg"></div>
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <h2 id="msg"></h2>
      <div class="btns">
        <button id="keepBtn">繼續玩</button>
        <button id="retryBtn">再試一次</button>
      </div>
    </div>
  </div>

  <div class="keys" id="keys">
    <button data-dir="ul">↖<span>Q</span></button>
    <button data-dir="up">↑<span>W</span></button>
    <button data-dir="ur">↗<span>E</span></button>
    <button data-dir="dl">↙<span>A</span></button>
    <button data-dir="down">↓<span>S</span></button>
    <button data-dir="dr">↘<span>D</span></button>
  </div>

  <div class="help">
    <strong>玩法：</strong>六角形棋盤有 <strong>三條軸、六個方向</strong>。
    用 <strong>Q W E / A S D</strong>（或上方按鈕）移動方塊：W/S 上下、Q/D 左上↔右下、E/A 右上↔左下。
    手機或滑鼠可直接往六個方向滑動。相同數字碰在一起會合併！按 <strong>Z</strong> 可以復原一步。
  </div>
</div>

<script>
(() => {
  const SQ3 = Math.sqrt(3);
  const COLORS = {
    2:    ['#eee4da', '#776e65'],
    4:    ['#ede0c8', '#776e65'],
    8:    ['#f2b179', '#f9f6f2'],
    16:   ['#f59563', '#f9f6f2'],
    32:   ['#f67c5f', '#f9f6f2'],
    64:   ['#f65e3b', '#f9f6f2'],
    128:  ['#edcf72', '#f9f6f2'],
    256:  ['#edcc61', '#f9f6f2'],
    512:  ['#edc850', '#f9f6f2'],
    1024: ['#edc53f', '#f9f6f2'],
    2048: ['#edc22e', '#f9f6f2'],
  };
  const SUPER = ['#3c3a32', '#f9f6f2'];

  // 平頂六角格、軸座標 (q, r)。三條軸各有兩個方向：
  //   上下 (0,∓1)、左上↔右下 (∓1,0)、右上↔左下 (±1,∓1)
  const DIRS = {
    up: [0, -1], down: [0, 1],
    ul: [-1, 0], dr: [1, 0],
    ur: [1, -1], dl: [-1, 1],
  };
  // 每個方向在螢幕上的角度（度，y 軸朝下），用於滑動判斷
  const ANGLES = { up: -90, ur: -30, dr: 30, down: 90, dl: 150, ul: -150 };

  const $ = id => document.getElementById(id);
  const boardEl = $('board'), tilesEl = $('tiles'), gridEl = $('grid'), overlay = $('overlay');
  const scoreEl = $('score'), bestEl = $('best');

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  let R, CELLS, INDEX, geo;
  let grid, score, won, keepPlaying, over, history, nextId = 1, best = 0;
  const tileEls = new Map();

  const key = (q, r) => q + ',' + r;
  const at = (q, r) => INDEX.get(key(q, r));

  function setup(radius) {
    R = radius;
    CELLS = []; INDEX = new Map();
    for (let q = -R; q <= R; q++)
      for (let r = -R; r <= R; r++)
        if (Math.abs(q + r) <= R) { INDEX.set(key(q, r), CELLS.length); CELLS.push({ q, r }); }

    gridEl.innerHTML = '';
    CELLS.forEach(() => {
      const d = document.createElement('div');
      d.className = 'cell hex';
      gridEl.appendChild(d);
    });
    tilesEl.innerHTML = '';
    tileEls.clear();

    document.querySelectorAll('button.size').forEach(b =>
      b.classList.toggle('active', +b.dataset.r === R));
    store.set('hex2048-size', R);
    best = +store.get('hex2048-best-' + R) || 0;
    bestEl.textContent = best;
    layout();
  }

  // ---- 版面計算 ----
  function layout() {
    const W = boardEl.clientWidth;
    // 外框為尖頂六角形，頂點距離 V = K * L；需同時包住上下與左右最外側的格子
    const K = Math.max(SQ3 * (R + 0.5), (1.5 * R + 1) / (SQ3 / 2)) + 0.3;
    const L = W / (SQ3 * K);       // 相鄰格中心距離的基準單位
    const V = K * L;
    const s = L * 0.9;             // 單格六角形外接圓半徑（留出間隙）
    boardEl.style.height = 2 * V + 'px';
    geo = { cx: W / 2, cy: V, L, s, w: 2 * s, h: SQ3 * s };

    [...gridEl.children].forEach((el, i) => {
      el.style.width = geo.w + 'px';
      el.style.height = geo.h + 'px';
      el.style.transform = pos(i);
    });
  }

  function pos(i) {
    const { q, r } = CELLS[i];
    const x = geo.cx + 1.5 * geo.L * q - geo.w / 2;
    const y = geo.cy + SQ3 * geo.L * (r + q / 2) - geo.h / 2;
    return `translate(${x}px, ${y}px)`;
  }

  // ---- 遊戲邏輯 ----
  const empty = () => Array(CELLS.length).fill(null);

  function addRandom() {
    const free = [];
    grid.forEach((t, i) => { if (!t) free.push(i); });
    if (!free.length) return;
    const i = free[Math.floor(Math.random() * free.length)];
    grid[i] = { id: nextId++, value: Math.random() < 0.9 ? 2 : 4, isNew: true };
  }

  function snapshot() {
    return { grid: grid.map(t => t && { id: t.id, value: t.value }), score, won };
  }

  function newGame() {
    grid = empty(); score = 0; won = false; keepPlaying = false; over = false; history = [];
    addRandom(); addRandom();
    hideOverlay();
    render();
    save();
  }

  // 依方向取得所有直線，每條線從移動目標端開始排列
  function lines(dir) {
    const [dq, dr] = DIRS[dir];
    const out = [];
    CELLS.forEach(({ q, r }) => {
      if (at(q + dq, r + dr) !== undefined) return; // 只從最前端的格子開始
      const line = [];
      for (let cq = q, cr = r, i; (i = at(cq, cr)) !== undefined; cq -= dq, cr -= dr) line.push(i);
      out.push(line);
    });
    return out;
  }

  function move(dir) {
    if (over || (won && !keepPlaying)) return;
    const prev = snapshot();
    let moved = false, gained = 0;
    const newGrid = empty();

    for (const coords of lines(dir)) {
      const tiles = coords.map(i => grid[i]).filter(Boolean);
      const result = [];
      for (let k = 0; k < tiles.length; k++) {
        const t = tiles[k];
        if (k + 1 < tiles.length && tiles[k + 1].value === t.value) {
          const v = t.value * 2;
          result.push({ id: nextId++, value: v, merged: true, from: [t, tiles[k + 1]] });
          gained += v;
          k++;
        } else {
          result.push({ id: t.id, value: t.value });
        }
      }
      result.forEach((t, k) => { newGrid[coords[k]] = t; });
      coords.forEach(i => {
        const a = grid[i], b = newGrid[i];
        if ((a ? a.id : 0) !== (b ? b.id : 0)) moved = true;
      });
    }

    if (!moved) return;
    history.push(prev);
    if (history.length > 50) history.shift();

    const ghosts = [];
    newGrid.forEach((t, i) => {
      if (t && t.merged) {
        t.from.forEach(f => ghosts.push({ id: f.id, i }));
        delete t.from;
      }
    });

    grid = newGrid;
    score += gained;
    if (gained) showPlus(gained);
    addRandom();
    render(ghosts);

    if (!won && grid.some(t => t && t.value === 2048)) {
      won = true;
      setTimeout(() => showOverlay('你贏了！', 'win'), 300);
    } else if (!canMove()) {
      over = true;
      setTimeout(() => showOverlay('遊戲結束！', 'lose'), 300);
    }
    save();
  }

  function canMove() {
    return CELLS.some(({ q, r }, i) => {
      const t = grid[i];
      if (!t) return true;
      // 每條軸只需檢查一個方向的鄰居
      return [DIRS.dr, DIRS.down, DIRS.ur].some(([dq, dr]) => {
        const j = at(q + dq, r + dr);
        return j !== undefined && grid[j] && grid[j].value === t.value;
      });
    });
  }

  function undo() {
    if (!history.length) return;
    const s = history.pop();
    grid = s.grid; score = s.score; won = s.won; over = false;
    hideOverlay();
    render();
    save();
  }

  // ---- 繪製 ----
  function fontSize(v) {
    const d = String(v).length;
    const ratio = d <= 2 ? 0.7 : d === 3 ? 0.56 : d === 4 ? 0.44 : 0.36;
    return Math.round(geo.s * ratio) + 'px';
  }

  function styleEl(el, v) {
    const [bg, fg] = COLORS[v] || SUPER;
    el.style.width = geo.w + 'px';
    el.style.height = geo.h + 'px';
    const inner = el.firstChild;
    inner.textContent = v;
    inner.style.background = bg;
    inner.style.color = fg;
    inner.style.fontSize = fontSize(v);
  }

  function makeEl(t) {
    const el = document.createElement('div');
    el.className = 'tile';
    const inner = document.createElement('div');
    inner.className = 'inner hex';
    el.appendChild(inner);
    styleEl(el, t.value);
    tilesEl.appendChild(el);
    return el;
  }

  function render(ghosts = []) {
    const alive = new Set();

    ghosts.forEach(g => {
      const el = tileEls.get(g.id);
      if (!el) return;
      el.style.transform = pos(g.i);
      tileEls.delete(g.id);
      setTimeout(() => el.remove(), 120);
    });

    grid.forEach((t, i) => {
      if (!t) return;
      alive.add(t.id);
      let el = tileEls.get(t.id);
      if (!el) {
        el = makeEl(t);
        el.style.transition = 'none';
        el.style.transform = pos(i);
        el.offsetWidth; // 強制重排
        el.style.transition = '';
        if (t.merged) el.classList.add('merged');
        else if (t.isNew) el.classList.add('new');
        tileEls.set(t.id, el);
      } else {
        el.style.transform = pos(i);
        styleEl(el, t.value);
        el.classList.remove('new', 'merged');
      }
      delete t.isNew; delete t.merged;
    });

    for (const [id, el] of tileEls) {
      if (!alive.has(id)) { el.remove(); tileEls.delete(id); }
    }

    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      store.set('hex2048-best-' + R, best);
    }
    $('undoBtn').disabled = !history.length;
    $('undoBtn').style.opacity = history.length ? 1 : 0.5;
  }

  function showPlus(n) {
    const p = document.createElement('div');
    p.className = 'plus';
    p.textContent = '+' + n;
    $('scoreBox').appendChild(p);
    setTimeout(() => p.remove(), 700);
  }

  function showOverlay(text, type) {
    $('msg').textContent = text;
    overlay.className = 'overlay show ' + type;
    $('keepBtn').style.display = type === 'win' ? '' : 'none';
  }
  function hideOverlay() { overlay.className = 'overlay'; }

  // ---- 存檔（每種棋盤大小各自一份）----
  function save() {
    store.set('hex2048-state-' + R, JSON.stringify({ ...snapshot(), keepPlaying, over, nextId }));
  }
  function load() {
    try {
      const s = JSON.parse(store.get('hex2048-state-' + R));
      if (!s || !Array.isArray(s.grid) || s.grid.length !== CELLS.length) return false;
      grid = s.grid; score = s.score; won = s.won; keepPlaying = s.keepPlaying;
      over = s.over; nextId = Math.max(nextId, s.nextId || 1000); history = [];
      hideOverlay();
      render();
      if (over) showOverlay('遊戲結束！', 'lose');
      else if (won && !keepPlaying) showOverlay('你贏了！', 'win');
      return true;
    } catch (e) { return false; }
  }

  function switchSize(radius) {
    setup(radius);
    if (!load()) newGame();
  }

  // ---- 輸入 ----
  const KEYS = {
    q: 'ul', w: 'up', e: 'ur', a: 'dl', s: 'down', d: 'dr',
    ArrowUp: 'up', ArrowDown: 'down',
    Home: 'ul', PageUp: 'ur', End: 'dl', PageDown: 'dr', // 數字鍵盤 7 9 1 3（NumLock 關閉時）
  };
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (KEYS[k]) { e.preventDefault(); move(KEYS[k]); }
    else if (k === 'z') undo();
  });

  let sx = 0, sy = 0, touching = false;
  boardEl.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; touching = true; });
  window.addEventListener('pointerup', e => {
    if (!touching) return;
    touching = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.hypot(dx, dy) < 25) return;
    const a = Math.atan2(dy, dx) * 180 / Math.PI;
    let bestDir = null, bestDiff = Infinity;
    for (const [dir, ang] of Object.entries(ANGLES)) {
      const diff = Math.abs(((a - ang + 540) % 360) - 180);
      if (diff < bestDiff) { bestDiff = diff; bestDir = dir; }
    }
    move(bestDir);
  });

  $('keys').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) move(b.dataset.dir);
  });
  document.querySelectorAll('button.size').forEach(b =>
    b.addEventListener('click', () => { if (+b.dataset.r !== R) switchSize(+b.dataset.r); }));
  $('newBtn').onclick = newGame;
  $('retryBtn').onclick = newGame;
  $('undoBtn').onclick = undo;
  $('keepBtn').onclick = () => { keepPlaying = true; hideOverlay(); save(); };

  window.addEventListener('resize', () => {
    tilesEl.classList.add('noanim');
    layout();
    grid.forEach((t, i) => {
      const el = t && tileEls.get(t.id);
      if (el) { el.style.transform = pos(i); styleEl(el, t.value); }
    });
    requestAnimationFrame(() => tilesEl.classList.remove('noanim'));
  });

  switchSize(+store.get('hex2048-size') === 3 ? 3 : 2);
})();
</script>
</body>
</html>
